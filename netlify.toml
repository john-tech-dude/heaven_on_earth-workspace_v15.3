[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

[[redirects]]
  from = "/data-room"
  to = "/data-room.html"
  status = 200

[[redirects]]
  from = "/farm-infrastructure-case-study"
  to = "/farm-infrastructure-case-study.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
